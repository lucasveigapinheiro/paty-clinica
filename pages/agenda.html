<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Interna | Clínica Estética Labessiê</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../Estilos/agenda.css">
</head>

<body>

    <aside class="sidebar">
        <div class="brand">Labessiê</div>
        <ul class="nav-menu">
            <li><a href="dashboard.html" class="nav-link"><i class="fas fa-th-large"></i> Visão Geral</a></li>
            <li><a href="pacientes.html" class="nav-link"><i class="fas fa-users"></i> Pacientes</a></li>
            <li><a href="agenda.html" class="nav-link active"><i class="fas fa-calendar-alt"></i> Agenda</a></li>
            <li><a href="configurações.html" class="nav-link"><i class="fas fa-cog"></i> Configurações</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="greeting">
                <h1 class="serif-font">Agenda da Clínica</h1>
                <p>Banco de dados interno e seguro.</p>
            </div>
            <div class="profile-area">
                <span style="font-weight: 500;">Patrícia</span>
                <div class="profile-img"></div>
            </div>
        </header>

        <div class="agenda-wrapper">
            <div class="agenda-card">
                <div class="calendar-header">
                    <button class="btn-icon" onclick="mudarMes(-1)"><i class="fas fa-chevron-left"></i></button>
                    <h3 id="mes-ano" class="serif-font">Mês Ano</h3>
                    <button class="btn-icon" onclick="mudarMes(1)"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="weekdays">
                    <div>Dom</div>
                    <div>Seg</div>
                    <div>Ter</div>
                    <div>Qua</div>
                    <div>Qui</div>
                    <div>Sex</div>
                    <div>Sáb</div>
                </div>
                <div id="dias-grid" class="days-grid"></div>
            </div>

            <div class="agenda-card">
                <div class="schedule-header">
                    <div>
                        <h2 class="serif-font" id="data-selecionada">Seleciona um dia</h2>
                    </div>
                    <button class="btn-add" onclick="abrirModal()">
                        <i class="fas fa-plus"></i> Novo Agendamento
                    </button>
                </div>
                <div id="lista-eventos" class="appointment-list">
                    <!-- Consultas do SQLite aparecem aqui -->
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Formulário -->
    <div id="modal-agendamento" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="fecharModal()"><i class="fas fa-times"></i></button>
            <h2 class="serif-font" style="color: var(--primary-burgundy); margin-bottom: 1.5rem;">Marcar Consulta</h2>

            <form id="form-agendamento" onsubmit="salvarNoBanco(event)">
                <div class="form-group">
                    <label>Paciente</label>
                    <input type="text" id="input-paciente" class="form-input" placeholder="Ex: Maria Eduarda Silva"
                        required>
                </div>
                <div class="form-group">
                    <label>Procedimento</label>
                    <select id="input-procedimento" class="form-input" required>
                        <option value="">Selecione um tratamento...</option>
                        <option value="Avaliação Inicial">Avaliação Inicial</option>
                        <option value="Botox Mom">Botox Mom</option>
                        <option value="Protocolo Harmoniglú">Protocolo Harmoniglú</option>
                        <option value="Estímulo de Colágeno PDRN">Estímulo de Colágeno PDRN</option>
                    </select>
                </div>
                <div class="row-inputs">
                    <div class="form-group">
                        <label>Hora de Início</label>
                        <input type="time" id="input-hora-inicio" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Hora de Fim</label>
                        <input type="time" id="input-hora-fim" class="form-input" required>
                    </div>
                </div>
                <button type="submit" class="btn-add" style="width: 100%; justify-content: center; margin-top: 10px;">
                    Guardar no SQLite
                </button>
            </form>
        </div>
    </div>
    <script src="../JavaScript/agenda.js"></script>
</body>

</html>
